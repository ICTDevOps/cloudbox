<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Cloudbox — connexion</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/login.js" defer></script>
</head>
<body class="login">
  <main class="login-card">
    <h1><img src="/assets/favicon.svg" alt="" width="32" height="32"> Cloudbox</h1>
    <p>Saisissez le jeton d'accès affiché par le script d'installation ou par
      <code>docker logs cloudbox</code>.</p>
    <form id="login-form" autocomplete="off">
      <label for="token">Jeton d'accès</label>
      <input id="token" name="token" type="password" required autofocus spellcheck="false">
      <button type="submit">Se connecter</button>
      <p id="login-error" class="error" role="alert" hidden>Jeton invalide.</p>
    </form>
    <p class="hint">Le jeton est aussi dans le volume : <code>~/.cloudbox/token</code>.</p>
  </main>
</body>
</html>
