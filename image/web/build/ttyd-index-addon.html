<script>
// Cloudbox : le clic droit va à tmux (menu des panneaux) sans ouvrir aussi le menu du navigateur.
// Maj + clic droit garde le menu du navigateur (coller, inspecter…).
document.addEventListener('contextmenu', function (event) {
  if (!event.shiftKey) event.preventDefault();
}, true);
</script>
<script>
// Cloudbox : reconnexion automatique après une coupure du serveur (redémarrage ou mise à jour du
// container). Quand ttyd affiche « Press ⏎ to Reconnect », on interroge le serveur toutes les 2 s ;
// la page se recharge seulement s'il a été injoignable puis répond de nouveau. Après un « exit »
// normal (serveur toujours joignable), le comportement de ttyd est conservé : Entrée pour relancer.
(function () {
  var PROMPT = 'Press ⏎ to Reconnect';
  var polling = false;
  var settled = false;
  // L'invite de ttyd est un div ajouté dans l'élément .xterm (le texte figure aussi dans le code
  // de la page : on ne regarde que cet élément)
  function promptVisible() {
    var nodes = document.querySelectorAll('.xterm > div');
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].textContent === PROMPT) return true;
    }
    return false;
  }
  function poll() {
    polling = true;
    var sawFailure = false;
    var url = location.pathname.replace(/\/?$/, '/') + 'token';
    var timer = setInterval(function () {
      fetch(url, { cache: 'no-store', credentials: 'same-origin' }).then(function (r) {
        if (!r.ok && r.status !== 401) { sawFailure = true; return; }
        clearInterval(timer);
        polling = false;
        if (sawFailure) location.reload();
        else settled = true;
      }).catch(function () { sawFailure = true; });
    }, 2000);
  }
  new MutationObserver(function () {
    if (!promptVisible()) { settled = false; return; }
    if (!polling && !settled) poll();
  }).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
})();
</script>
<script>
// Cloudbox : copier-coller avec tmux (souris activée).
//  - Copier : une sélection à la souris est faite par tmux, qui transmet le texte copié par la
//    séquence OSC 52 (set-clipboard on) ; ttyd ne la gère pas, on l'envoie au presse-papiers du
//    navigateur. La lecture du presse-papiers par un programme (OSC 52 « ? ») reste refusée.
//  - Coller : Ctrl+V (et Ctrl+Maj+V) est laissé au navigateur, qui colle le presse-papiers
//    (collage « bracketed » géré par xterm.js) au lieu d'envoyer ^V au shell.
(function () {
  function decode(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  // Langue de l'interface du portail (même origine : même localStorage)
  function en() {
    try { return localStorage.getItem('cloudbox.lang') === 'en'; } catch (e) { return false; }
  }
  function notice(text) {
    var el = document.createElement('div');
    el.textContent = text;
    el.style.cssText = 'position:fixed;top:8px;right:12px;z-index:100;padding:3px 10px;border-radius:6px;' +
      'background:rgba(0,0,0,.75);color:#fff;font:13px system-ui,sans-serif;pointer-events:none';
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 900);
  }
  function setup(term) {
    term.parser.registerOscHandler(52, function (data) {
      var payload = data.slice(data.indexOf(';') + 1);
      if (!payload || payload === '?') return true;
      try {
        navigator.clipboard.writeText(decode(payload)).then(function () { notice(en() ? 'Copied' : 'Copié'); },
          function () { notice(en() ? 'Copy blocked by the browser' : 'Copie refusée par le navigateur'); });
      } catch (e) {
        notice(en() ? 'Copy failed' : 'Copie impossible');
      }
      return true;
    });
    term.attachCustomKeyEventHandler(function (event) {
      var paste = event.ctrlKey && !event.altKey && !event.metaKey && event.key.toLowerCase() === 'v';
      return !paste;
    });
  }
  // window.term est créé par ttyd après le chargement de cette page (et à chaque reconnexion)
  var timer = setInterval(function () {
    if (window.term && window.term.parser) {
      clearInterval(timer);
      setup(window.term);
    }
  }, 50);
})();
</script>
<script>
// Cloudbox : apparence du terminal (police, taille, interligne, curseur, couleurs), réglée dans la
// fenêtre Paramètres du portail. Lue dans le cache « cloudbox.terminal » (même origine : même
// localStorage), puis dans /api/preferences ; un changement fait dans le portail arrive par
// l'événement « storage » et s'applique sans recharger. ttyd réapplique ses propres options à la
// connexion et recrée window.term à la reconnexion : on réapplique à chaque nouveau terminal.
(function () {
  var LIGHT = {
    background: '#ffffff', foreground: '#24292f', cursor: '#24292f', cursorAccent: '#ffffff',
    selectionBackground: '#b6d7ff', selectionForeground: '#24292f',
    black: '#24292f', red: '#cf222e', green: '#116329', yellow: '#9a6700',
    blue: '#0969da', magenta: '#8250df', cyan: '#1b7c83', white: '#6e7781',
    brightBlack: '#57606a', brightRed: '#a40e26', brightGreen: '#1a7f37', brightYellow: '#633c01',
    brightBlue: '#0550ae', brightMagenta: '#6639ba', brightCyan: '#136061', brightWhite: '#ffffff'
  };
  var dark = null; // couleurs d'origine de ttyd, relevées sur le premier terminal
  var prefs = null;
  var applied = null;
  var media = window.matchMedia('(prefers-color-scheme: dark)');

  function read(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function cached() {
    try { return JSON.parse(read('cloudbox.terminal') || 'null'); } catch (e) { return null; }
  }
  // Couleurs : choix du terminal, sinon thème du portail, sinon système
  function isDark() {
    var choice = prefs && prefs.theme !== 'auto' ? prefs.theme : read('cloudbox.theme');
    if (choice === 'light' || choice === 'dark') return choice === 'dark';
    return media.matches;
  }
  function apply(term) {
    if (!term || !term.options) return;
    if (!dark) dark = Object.assign({}, term.options.theme || {});
    if (!prefs) return;
    var o = term.options;
    var theme = isDark() ? dark : LIGHT;
    o.fontFamily = prefs.fontFamily || 'Consolas, "Liberation Mono", Menlo, Courier, monospace';
    o.fontSize = prefs.fontSize;
    o.lineHeight = prefs.lineHeight;
    o.cursorStyle = prefs.cursorStyle;
    o.cursorBlink = prefs.cursorBlink;
    o.theme = theme;
    document.documentElement.style.background = theme.background || '';
    document.body.style.background = theme.background || '';
    applied = term;
    // ttyd recalcule la taille du terminal (lignes, colonnes) sur l'événement resize de la fenêtre
    window.dispatchEvent(new Event('resize'));
  }
  function update(next) {
    if (!next || typeof next !== 'object') return;
    prefs = next;
    apply(window.term);
  }

  update(cached());
  fetch('/api/preferences', { cache: 'no-store', credentials: 'same-origin' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (p) { if (p) update(p.terminal); })
    .catch(function () { /* valeurs du cache ou de ttyd */ });

  window.addEventListener('storage', function (event) {
    if (event.key === 'cloudbox.terminal') update(cached());
    else if (event.key === 'cloudbox.theme') apply(window.term);
  });
  media.addEventListener('change', function () { apply(window.term); });

  // Nouveau terminal (chargement, reconnexion) ou options remises par ttyd à la connexion
  setInterval(function () {
    var term = window.term;
    if (!term || !term.options || !prefs) return;
    if (term !== applied || term.options.fontSize !== prefs.fontSize) apply(term);
  }, 500);
})();
</script>
