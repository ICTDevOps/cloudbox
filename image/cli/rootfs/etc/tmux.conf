# Configuration tmux de Cloudbox (sessions du terminal web et de docker exec)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
# Molette : défilement de l'historique dans le navigateur. Maj + sélection pour copier.
set -g mouse on
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# Barre d'état discrète
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[fg=colour39,bold] #S #[default]"
set -g status-right "#[fg=colour244]%H:%M "
set -g status-left-length 20
