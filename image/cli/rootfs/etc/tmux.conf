# Configuration tmux de Cloudbox (sessions du terminal web et de docker exec)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
# Molette : défilement de l'historique. Sélection à la souris : copiée dans le presse-papiers du
# navigateur (OSC 52, relayé par la page ttyd de Cloudbox). Ctrl+V colle.
set -g mouse on
set -g set-clipboard on
# Menus du clic droit : restent ouverts jusqu'au clic (-O). Sans cela, le premier mouvement de la
# souris les ferme : un déplacement sans bouton est transmis comme un « relâchement » hors du
# menu. Les menus par défaut de tmux sont repris tels quels (idempotent : -O n'est ajouté qu'une fois).
run-shell "tmux list-keys -T root | grep MouseDown3 | sed 's/display-menu -T/display-menu -O -T/' | tmux source-file -"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# Barre d'état discrète
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[fg=colour39,bold] #S #[default]"
set -g status-right "#[fg=colour244]%H:%M "
set -g status-left-length 48
